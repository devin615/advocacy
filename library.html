<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <a href="index.html" class="nav-btn"><span>🏠</span>Dashboard</a>
    <a href="diabetes.html" class="nav-btn"><span>🧪</span>Metabolic</a>
    <a href="clinical-data.html" class="nav-btn"><span>🧠</span>Vascular</a>
    <a href="simulator.html" class="nav-btn sim-btn"><span>🎭</span>Simulator</a>
    <a href="library.html" class="nav-btn active"><span>📚</span>Evidence</a>
</nav>
<div id="gate" class="lock-overlay">
    <div class="lock-box">
        <h2 style="color: var(--primary);">Restricted</h2>
        <p style="font-size: 0.9rem; color: var(--text-muted);">Hint: Beautiful flying insect... <strong>"Scott"</strong>.</p>
        <input type="password" id="pass" placeholder="Password">
        <button onclick="unlock()" class="unlock-btn">Unlock</button>
        <p id="error-msg" style="color: var(--high); display: none; margin-top: 10px;">Incorrect.</p>
    </div>
</div>
<div class="container">
    <h2 style="color: var(--primary); font-size: 1.4rem;">Clinical Evidence</h2>
    <div class="file-grid">
        <a href="#" class="file-card"><span class="file-icon">📄</span><div><strong>A1C Trend.pdf</strong><br><small>Endocrine</small></div></a>
        <a href="#" class="file-card"><span class="file-icon">📄</span><div><strong>Metabolic Panel.pdf</strong><br><small>Metabolic</small></div></a>
        <a href="#" class="file-card"><span class="file-icon">📄</span><div><strong>CT Angio Head.pdf</strong><br><small>Cerebral</small></div></a>
        <a href="#" class="file-card"><span class="file-icon">📄</span><div><strong>MRI Brain Report.pdf</strong><br><small>Infarct</small></div></a>
    </div>
</div>
<script>
    function unlock() {
        if (document.getElementById('pass').value.toLowerCase() === 'butterfly') {
            document.getElementById('gate').style.display = 'none';
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    }
</script>
</body>
</html>
